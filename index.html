<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yardget</title>
  <meta name="description" content="Yardget — Ton budget, tes yards. Dépenses, abonnements et budget mensuel sur ton téléphone.">
  <meta name="theme-color" content="#F4F5F8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Thème appliqué avant le premier affichage, pour éviter un flash clair en mode sombre
    try {
      var d = JSON.parse(localStorage.getItem('yardget:v1') || '{}');
      var t = (d.settings && d.settings.theme) || 'auto';
      var dark = t === 'sombre' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="sheet" class="sheet-root"></div>
  <div id="toast" aria-live="polite"></div>
  <noscript><p style="padding:24px">Cette application a besoin de JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
