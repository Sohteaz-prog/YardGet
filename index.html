<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yardget</title>
  <meta name="description" content="Yardget — Ton budget, tes yards. Dépenses, abonnements et budget mensuel sur ton téléphone.">
  <meta name="theme-color" content="#F4F5F8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Thème appliqué avant le premier affichage, pour éviter un flash clair en mode sombre
    try {
      var d = JSON.parse(localStorage.getItem('yardget:v1') || '{}');
      var t = (d.settings && d.settings.theme) || 'auto';
      var dark = t === 'sombre' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="boot" style="font-family:system-ui,sans-serif;max-width:420px;margin:30vh auto 0;padding:0 24px;text-align:center;color:#5A6070">
    <p style="font-size:18px;font-weight:700;color:inherit">Chargement de Yardget…</p>
  </div>
  <script>
    // Si l'appli ne démarre pas (fichier manquant sur le serveur), on l'explique au lieu d'une page blanche.
    setTimeout(function () {
      if (window.__YARDGET_OK__) return;
      var b = document.getElementById('boot');
      if (b) b.innerHTML = '<p style="font-size:18px;font-weight:700;color:#B91C1C">Yardget ne s’est pas chargé</p>'
        + '<p style="font-size:14px;line-height:1.5">Un fichier de l’appli est introuvable. Vérifie que <b>app.js</b>, <b>styles.css</b> et <b>index.html</b> sont bien à la racine du dépôt GitHub, puis recharge la page.</p>';
    }, 6000);
  </script>
  <div id="sheet" class="sheet-root"></div>
  <div id="toast" aria-live="polite"></div>
  <noscript><p style="padding:24px">Cette application a besoin de JavaScript.</p></noscript>
  <script src="app.js" defer></script>
</body>
</html>
